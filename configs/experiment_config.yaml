# ==============================================================================
# Multilingual Position Bias & Mitigation Benchmark (M-PosBench)
# ==============================================================================
experiment_name: "m_pos_bias_study"
seed: 42

# Depth positions where the target needle is placed (0.0 = absolute start, 1.0 = absolute end)
depth_bins: [0.0, 0.15, 0.30, 0.50, 0.70, 0.85, 1.0]

# Languages under evaluation
languages:
  - code: "en"
    name: "English"
    script: "Latin"
  - code: "hi"
    name: "Hindi"
    script: "Devanagari"
  - code: "te"
    name: "Telugu"
    script: "Telugu"

# Approximate context tokens / distractors
context_lengths:
  short: 2000
  medium: 4000
  long: 8000

# Number of distinct paired evaluation instances per (language, length, model) condition
samples_per_cell: 10

# Generation parameters (deterministic evaluation)
temperature: 0.0
max_tokens: 40

# Models supported via API
models:
  groq:
    - id: "qwen/qwen3.8-27b"
      display_name: "Qwen-3.8-27B (Groq)"
      provider: "groq"
    - id: "openai/gpt-oss-20b"
      display_name: "GPT-OSS-20B (Groq)"
      provider: "groq"
  gemini:
    - id: "gemini-3.5-flash-lite"
      display_name: "Gemini-3.5-Flash-Lite"
      provider: "gemini"
    - id: "gemini-3.5-flash"
      display_name: "Gemini-3.5-Flash"
      provider: "gemini"

# Mitigation strategies to evaluate
mitigations:
  - id: "baseline"
    description: "Standard sequential document context (no reordering)"
  - id: "decr"
    description: "Dynamic Edge-Centric Context Reordering (Sandwich Chunking)"
